{% extends 'quotes/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-3">Скидання паролю</h3>
                <p class="text-muted small text-center mb-4">Введіть електронну пошту, вказану при реєстрації. Ми надішлемо вам посилання для зміни паролю.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email адреса</label>
                        <input type="email" name="email" maxlength="254" class="form-control" required id="id_email">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Надіслати інструкції</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
