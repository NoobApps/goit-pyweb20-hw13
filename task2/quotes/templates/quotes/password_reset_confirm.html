{% extends 'quotes/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Введіть новий пароль</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            <input type="password" name="{{ field.name }}" class="form-control {% if field.errors %}is-invalid{% endif %}" id="{{ field.id_for_label }}" required>
                            {% if field.help_text %}
                                <div class="form-text small">{{ field.help_text|safe }}</div>
                            {% endif %}
                            {% if field.errors %}
                                <div class="invalid-feedback">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Змінити пароль</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
